# Git push -> GitHub Actions -> CloudFormation -> Ubuntu + Nginx on EC2
# AWS access uses GitHub OIDC (short-lived credentials), never stored access keys.
name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - cloudformation.yaml
      - .github/workflows/deploy.yml
  pull_request:
    paths:
      - cloudformation.yaml
      - .github/workflows/deploy.yml
  workflow_dispatch:

# Least-privilege token: read the repo, request an OIDC token.
permissions:
  id-token: write
  contents: read

# Never run two stack operations at the same time.
concurrency:
  group: cloudformation-dev
  cancel-in-progress: false

env:
  STACK_NAME: bongodev-github-iac-dev

jobs:
  lint:
    name: Lint template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Run cfn-lint
        run: cfn-lint cloudformation.yaml

  deploy:
    name: Validate and deploy
    needs: lint
    # Pull requests only get linted; deploys happen from main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `environment:` key on purpose: it would change the OIDC subject claim
    # and the IAM trust policy (ref:refs/heads/main) would reject the token.
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-iac-deploy

      - name: Confirm AWS identity
        run: aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body file://cloudformation.yaml --region "$AWS_REGION"

      - name: Create or update stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides Environment=dev \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table

      - name: Note on bootstrap time
        run: echo 'Stack deployed. EC2 User Data may need a few more minutes to install Nginx.'
